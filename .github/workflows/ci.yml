name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  console-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python test_app.py

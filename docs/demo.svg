<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="825" viewBox="0 0 1100 825">
<rect width="1100" height="825" fill="#101e31"/>
<text x="32" y="45" fill="#72d6c7" font-family="sans-serif" font-size="24">StreamFlix++ / Actual console output</text>
<text x="32" y="95" fill="#e3ebf6" font-family="monospace" font-size="17" xml:space="preserve">================================================================================</text>
<text x="32" y="120" fill="#e3ebf6" font-family="monospace" font-size="17" xml:space="preserve">                             MOVIE Lists</text>
<text x="32" y="145" fill="#e3ebf6" font-family="monospace" font-size="17" xml:space="preserve">================================================================================</text>
<text x="32" y="170" fill="#e3ebf6" font-family="monospace" font-size="17" xml:space="preserve">ACTION    | [Silent ...] |  Firesto...  |  Shadow ...  |</text>
<text x="32" y="195" fill="#e3ebf6" font-family="monospace" font-size="17" xml:space="preserve">ROMANCE   |  Letters...  |  Autumn ...  |</text>
<text x="32" y="220" fill="#e3ebf6" font-family="monospace" font-size="17" xml:space="preserve">COMEDY    |  Just Fr...  |</text>
<text x="32" y="245" fill="#e3ebf6" font-family="monospace" font-size="17" xml:space="preserve">================================================================================</text>
<text x="32" y="270" fill="#e3ebf6" font-family="monospace" font-size="17" xml:space="preserve">=========Navigation Menu==========</text>
<text x="32" y="295" fill="#e3ebf6" font-family="monospace" font-size="17" xml:space="preserve">Use the options below to navigate:</text>
<text x="32" y="320" fill="#e3ebf6" font-family="monospace" font-size="17" xml:space="preserve">U to move up</text>
<text x="32" y="345" fill="#e3ebf6" font-family="monospace" font-size="17" xml:space="preserve">D to move down</text>
<text x="32" y="370" fill="#e3ebf6" font-family="monospace" font-size="17" xml:space="preserve">L to move left</text>
<text x="32" y="395" fill="#e3ebf6" font-family="monospace" font-size="17" xml:space="preserve">R to move right</text>
<text x="32" y="420" fill="#e3ebf6" font-family="monospace" font-size="17" xml:space="preserve">X to select movie</text>
<text x="32" y="445" fill="#e3ebf6" font-family="monospace" font-size="17" xml:space="preserve">Q to exit movie canvas</text>
<text x="32" y="470" fill="#e3ebf6" font-family="monospace" font-size="17" xml:space="preserve">=========MOVIE Actions==========</text>
<text x="32" y="495" fill="#e3ebf6" font-family="monospace" font-size="17" xml:space="preserve">Select an option below:</text>
<text x="32" y="520" fill="#e3ebf6" font-family="monospace" font-size="17" xml:space="preserve">V to View movie details</text>
<text x="32" y="545" fill="#e3ebf6" font-family="monospace" font-size="17" xml:space="preserve">P to Play movie</text>
<text x="32" y="570" fill="#e3ebf6" font-family="monospace" font-size="17" xml:space="preserve">W to Add to watchlist/playlist</text>
<text x="32" y="595" fill="#e3ebf6" font-family="monospace" font-size="17" xml:space="preserve">Q to Exit</text>
<text x="32" y="620" fill="#e3ebf6" font-family="monospace" font-size="17" xml:space="preserve">Movie Details:</text>
<text x="32" y="645" fill="#e3ebf6" font-family="monospace" font-size="17" xml:space="preserve">ID: m1</text>
<text x="32" y="670" fill="#e3ebf6" font-family="monospace" font-size="17" xml:space="preserve">Name: Silent Pursuit</text>
<text x="32" y="695" fill="#e3ebf6" font-family="monospace" font-size="17" xml:space="preserve">Year: 1985</text>
<text x="32" y="720" fill="#e3ebf6" font-family="monospace" font-size="17" xml:space="preserve">Description: A relentless detective chases a cunning fugitive across the city</text>
<text x="32" y="745" fill="#e3ebf6" font-family="monospace" font-size="17" xml:space="preserve">Review Rating: 4.5</text>
<text x="32" y="770" fill="#e3ebf6" font-family="monospace" font-size="17" xml:space="preserve">Genre: ACTION</text>
<text x="32" y="795" fill="#e3ebf6" font-family="monospace" font-size="17" xml:space="preserve">Cast: Michael Carter</text>
</svg>
